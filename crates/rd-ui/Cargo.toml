[package]
name = "rd-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "ReelDeck user-interface state model and the framework-neutral shell prototype. No GUI framework bound yet; the shipping-shell decision is recorded in docs/UI_DESIGN.md."

[dependencies]
rd-core = { path = "../rd-core", version = "0.1.0" }
rd-analyze = { path = "../rd-analyze", version = "0.1.0" }
rd-pipeline = { path = "../rd-pipeline", version = "0.1.0" }
# Consumes rd-run's exact Progress callback payload and RunReport outcome
# types rather than re-deriving them, so the job journal cannot disagree
# with the executor's contract. No new external dependency: rd-run shares
# the same serde/thiserror set and does not depend back on rd-ui.
rd-run = { path = "../rd-run", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
