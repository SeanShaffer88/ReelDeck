[package]
name = "rd-mediakit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Safe Rust wrapper over the MediaKit DLL (header-level media probing) for ReelDeck, with a clean unavailable error on non-Windows platforms."

# Justification for this crate's existence (workspace rule: FFI is
# scoped narrowly): rd-analyze forbids unsafe code, and MediaKit is a
# C ABI DLL, so the FFI declarations and every unsafe block live here
# — and only here — each commented with its invariants. No new
# external dependency is introduced: only the workspace's existing
# serde / serde_json / thiserror.

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
