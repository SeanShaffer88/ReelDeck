name: diag-temp

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run gates and capture diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "=== FORMAT ==="
            cargo fmt --all -- --check
            echo "fmt exit: $?"
            echo "=== CLIPPY ==="
            cargo clippy --workspace --all-targets -- -D warnings
            echo "clippy exit: $?"
            echo "=== TEST ==="
            cargo test --workspace
            echo "test exit: $?"
          } > diag.txt 2>&1
      - name: Post diagnostics to PR
        shell: bash
        if: always()
        run: gh pr comment "$PR_NUMBER" --body-file diag.txt
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
