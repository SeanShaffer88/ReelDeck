name: rustfmt-fix (temporary)

# One-shot helper: applies the repository's canonical rustfmt output and
# pushes it back to the current branch. Removed in a later commit.
on:
  push:
    branches:
      - "arena/12e0f24f-reeldeck"

permissions:
  contents: write

jobs:
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        shell: bash
        run: cargo fmt --all
      - name: Commit and push formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
          else
            git add -A
            git commit -m "Apply cargo fmt"
            git push
          fi
