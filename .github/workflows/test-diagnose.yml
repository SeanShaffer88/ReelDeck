name: test-diagnose (temporary)

# One-shot diagnostic: posts the workspace test output as a PR comment
# because the sandbox cannot read Actions log storage. Removed after
# diagnosis.
on:
  push:
    branches:
      - "arena/9f2efe01-reeldeck"

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests and capture output
        shell: bash
        run: |
          cargo test --workspace > test.txt 2>&1 || true
      - name: Post test output to PR #7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 7 --body-file test.txt
