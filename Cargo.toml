[workspace]
resolver = "2"
members = [
    "crates/rd-core",
    "crates/rd-analyze",
    "crates/rd-pipeline",
    "crates/rd-run",
    "crates/rd-ui",
    "crates/reeldeck",
]

[workspace.package]
edition = "2021"
license = "GPL-2.0-only"
rust-version = "1.80"
repository = "https://github.com/SeanShaffer88/ReelDeck"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
